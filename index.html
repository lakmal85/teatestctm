    const captureBtn = document.getElementById('captureBtn');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const resultCard = document.getElementById('resultCard');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const toast = document.getElementById('toast');
    const voiceIndicator = document.getElementById('voiceIndicator');
    const gradesGrid = document.getElementById('gradesGrid');
    const historyList = document.getElementById('historyList');

    // ============================================
    // CAMERA SETUP (Auto Permission)
    // ============================================
    async function initCamera() {
        try {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            
            const constraints = {
                video: {
                    facingMode: { exact: currentCamera },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoFeed.srcObject = videoStream;
            
            showToast(`Camera ready - ${currentCamera === 'environment' ? 'Back' : 'Front'} camera`, "success");
            
            // Auto-start scanning animation
            animateCameraReady();
            
        } catch (error) {
            console.error("Camera error:", error);
            // Fallback to any available camera
            try {
                const fallbackConstraints = { video: true };
                videoStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                videoFeed.srcObject = videoStream;
                showToast("Camera connected (fallback mode)", "warning");
            } catch (fallbackError) {
                showToast("Unable to access camera. Please check permissions.", "error");
            }
        }
    }

    function animateCameraReady() {
        anime({
            targets: '.camera-container',
            scale: [0.98, 1],
            duration: 600,
            easing: 'easeOutElastic'
        });
    }

    // Switch Camera
    switchCameraBtn.addEventListener('click', () => {
        currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
        initCamera();
    });

    // ============================================
    // AI CLASSIFICATION (Simulates Sensor Data from Image)
    // ============================================
    function analyzeImageFromVideo() {
        return new Promise((resolve) => {
            // Create canvas to capture video frame
            const canvas = document.createElement('canvas');
            canvas.width = videoFeed.videoWidth;
            canvas.height = videoFeed.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoFeed, 0, 0, canvas.width, canvas.height);
            
            // Get image data for "AI" analysis
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Calculate average RGB values to simulate sensor readings
            let r = 0, g = 0, b = 0;
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i+1];
                b += data[i+2];
            }
            const pixelCount = data.length / 4;
            r = r / pixelCount / 255;
            g = g / pixelCount / 255;
            b = b / pixelCount / 255;
            
            // Convert RGB to simulated sensor values (1.0 - 3.0 range)
            // Darker tea leaves = higher values (more fermented/broken)
            const avgBrightness = (r + g + b) / 3;
            // Inverse: darker = higher sensor reading
            const mq3 = 1.2 + (1 - avgBrightness) * 2.2;
            const mq5 = 0.8 + (1 - avgBrightness) * 2.0;
            const mq9 = 1.0 + (1 - avgBrightness) * 2.1;
            
            // Add some randomization for realism
            const finalMq3 = Math.min(3.0, Math.max(1.0, mq3 + (Math.random() - 0.5) * 0.2));
            const finalMq5 = Math.min(2.8, Math.max(0.8, mq5 + (Math.random() - 0.5) * 0.2));
            const finalMq9 = Math.min(3.0, Math.max(1.0, mq9 + (Math.random() - 0.5) * 0.2));
            
            resolve({ mq3: finalMq3, mq5: finalMq5, mq9: finalMq9 });
        });
    }

    function classifyTea(mq3, mq5, mq9) {
        let bestMatch = null;
        let bestDistance = Infinity;
        
        for (const grade of teaGrades) {
            const distance = Math.sqrt(
                Math.pow(mq3 - grade.mq3, 2) * 0.4 +
                Math.pow(mq5 - grade.mq5, 2) * 0.3 +
                Math.pow(mq9 - grade.mq9, 2) * 0.3
            );
            
            if (distance < bestDistance) {
                bestDistance = distance;
                bestMatch = grade;
            }
        }
        
        // Calculate confidence (inverse of distance, normalized)
        const maxDistance = 2.0;
        const confidence = Math.min(0.99, Math.max(0.65, 1.0 - (bestDistance / maxDistance)));
        
        return { grade: bestMatch, confidence, distance: bestDistance };
    }

    // ============================================
    // SPEECH SYNTHESIS (Sinhala + English)
    // ============================================
    function speakText(text, language = 'si') {
        if (!window.speechSynthesis) {
            console.warn("Speech synthesis not supported");
            return;
        }
        
        // Cancel any ongoing speech
        speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        if (language === 'si') {
            // Sinhala voice selection
            utterance.lang = 'si-LK';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            
            // Try to find Sinhala voice
            const voices = speechSynthesis.getVoices();
            const sinhalaVoice = voices.find(v => v.lang.includes('si') || v.lang.includes('sin'));
            if (sinhalaVoice) utterance.voice = sinhalaVoice;
        } else {
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
        }
        
        utterance.onerror = (e) => console.error("Speech error:", e);
        speechSynthesis.speak(utterance);
        
        // Animate voice indicator
        anime({
            targets: voiceIndicator,
            scale: [1, 1.2, 1],
            duration: 500,
            easing: 'easeInOutQuad'
        });
    }

    function announceGrade(grade, confidence) {
        const sinhalaMessage = `${grade.sinhala} ලෙස හඳුනාගෙන ඇත. විශ්වාසනීයත්වය සියයට ${Math.round(confidence * 100)} කි.`;
        const englishMessage = `Tea grade identified as ${grade.english}. Confidence ${Math.round(confidence * 100)} percent.`;
        
        // Speak in Sinhala first, then English
        speakText(sinhalaMessage, 'si');
        setTimeout(() => {
            speakText(englishMessage, 'en');
        }, 3000);
    }

    // ============================================
    // UI UPDATE FUNCTIONS WITH ANIMATIONS
    // ============================================
    function showToast(message, type = 'info') {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    function showLoading(show) {
        if (show) {
            loadingOverlay.classList.add('active');
        } else {
            loadingOverlay.classList.remove('active');
        }
    }

    function updateUIWithResult(grade, confidence, sensors) {
        // Animate result card entrance
        resultCard.style.display = 'block';
        anime({
            targets: resultCard,
            opacity: [0, 1],
            translateY: [30, 0],
            duration: 600,
            easing: 'easeOutBack'
        });
        
        // Update grade information
        document.getElementById('gradeName').innerHTML = `<i class="fas fa-leaf" style="color: ${grade.color}"></i> ${grade.english}`;
        document.getElementById('gradeSinhala').innerHTML = grade.sinhala;
        document.getElementById('gradeBadge').style.background = `linear-gradient(135deg, ${grade.color}40, ${grade.color}20)`;
        
        // Confidence animation
        const confidencePercent = Math.round(confidence * 100);
        document.getElementById('confidencePercent').innerHTML = `${confidencePercent}%`;
        document.getElementById('confidenceFill').style.width = `${confidencePercent}%`;
        
        // Sensor values
        document.getElementById('mq3Val').innerHTML = sensors.mq3.toFixed(2) + 'V';
        document.getElementById('mq5Val').innerHTML = sensors.mq5.toFixed(2) + 'V';
        document.getElementById('mq9Val').innerHTML = sensors.mq9.toFixed(2) + 'V';
        
        // Confetti animation on high confidence
        if (confidence > 0.85) {
            createConfetti();
        }
        
        // Add to history
        addToHistory(grade, confidence);
    }
    
    function createConfetti() {
        // Simple confetti effect
        for (let i = 0; i < 30; i++) {
            const confetti = document.createElement('div');
            confetti.innerHTML = '🍃';
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-20px';
            confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
            confetti.style.opacity = '0.8';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = '999';
            confetti.style.transition = 'all 2s ease-out';
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.style.top = '100vh';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            }, 10);
            
            setTimeout(() => {
                confetti.remove();
            }, 2000);
        }
    }
    
    function addToHistory(grade, confidence) {
        const record = {
            grade: grade.code,
            sinhala: grade.sinhala,
            confidence: confidence,
            timestamp: new Date().toLocaleTimeString(),
            date: new Date().toISOString()
        };
        
        history.unshift(record);
        if (history.length > 20) history.pop();
        localStorage.setItem('teaHistory', JSON.stringify(history));
        renderHistory();
    }
    
    function renderHistory() {
        if (history.length === 0) {
            historyList.innerHTML = '<div class="history-item" style="opacity:0.6; text-align:center; justify-content:center;">No history yet. Identify tea to start.</div>';
            return;
        }
        
        historyList.innerHTML = history.slice(0, 10).map(item => `
            <div class="history-item">
                <div>
                    <div class="history-grade">${item.grade} - ${item.sinhala}</div>
                    <div class="history-time">${item.timestamp}</div>
                </div>
                <div style="font-size:0.8rem; color:#ffd700;">${Math.round(item.confidence * 100)}%</div>
            </div>
        `).join('');
    }
    
    // ============================================
    // CAPTURE & CLASSIFY
    // ============================================
    async function captureAndIdentify() {
        showLoading(true);
        
        // Play camera shutter animation
        anime({
            targets: '.camera-container',
            scale: [1, 0.98, 1],
            duration: 200,
            easing: 'easeInOutQuad'
        });
        
        try {
            // Analyze image from video feed
            const sensors = await analyzeImageFromVideo();
            const { grade, confidence } = classifyTea(sensors.mq3, sensors.mq5, sensors.mq9);
            
            // Update UI
            updateUIWithResult(grade, confidence, sensors);
            
            // Speak the result
            announceGrade(grade, confidence);
            
            showToast(`Identified: ${grade.code} - ${Math.round(confidence * 100)}% confidence`, "success");
            
        } catch (error) {
            console.error("Classification error:", error);
            showToast("Error analyzing image. Please try again.", "error");
        } finally {
            showLoading(false);
        }
    }
    
    captureBtn.addEventListener('click', captureAndIdentify);
    
    // ============================================
    // VOICE COMMAND RECOGNITION
    // ============================================
    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            console.warn("Speech recognition not supported");
            voiceIndicator.style.opacity = '0.5';
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'si-LK'; // Sinhala
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onresult = (event) => {
            const command = event.results[0][0].transcript.toLowerCase();
            console.log("Voice command:", command);
            
            if (command.includes('හඳුනා') || command.includes('identify') || command.includes('capture')) {
                captureAndIdentify();
                speakText("හඳුනා ගැනීම ආරම්භ කරමින්", 'si');
            } else if (command.includes('උදව්') || command.includes('help')) {
                speakText("තේ හඳුනා ගැනීමට කැමරාව තේ කොළ වෙත යොමු කර හඳුනා ගන්න බොත්තම ඔබන්න", 'si');
            } else {
                speakText("අණවේදනය නොතේරුණි. කරුණාකර නැවත උත්සාහ කරන්න", 'si');
            }
        };
        
        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            voiceIndicator.classList.remove('listening');
            isListening = false;
        };
        
        recognition.onend = () => {
            voiceIndicator.classList.remove('listening');
            isListening = false;
        };
    }
    
    voiceIndicator.addEventListener('click', () => {
        if (!recognition) {
            initSpeechRecognition();
        }
        
        if (isListening) {
            recognition.stop();
            voiceIndicator.classList.remove('listening');
            isListening = false;
        } else {
            recognition.start();
            voiceIndicator.classList.add('listening');
            isListening = true;
            speakText("අසමින්, කතා කරන්න", 'si');
        }
    });
    
    // ============================================
    // POPULATE GRADES GRID
    // ============================================
    function populateGradesGrid() {
        gradesGrid.innerHTML = teaGrades.map(grade => `
            <div class="grade-chip" data-grade="${grade.code}" data-sinhala="${grade.sinhala}" data-mq3="${grade.mq3}" data-mq5="${grade.mq5}" data-mq9="${grade.mq9}">
                ${grade.code}
            </div>
        `).join('');
        
        // Add click handlers for grade chips (for manual selection/testing)
        document.querySelectorAll('.grade-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const gradeCode = chip.dataset.grade;
                const grade = teaGrades.find(g => g.code === gradeCode);
                if (grade) {
                    // Simulate classification with this grade's sensor values
                    const sensors = {
                        mq3: grade.mq3 + (Math.random() - 0.5) * 0.1,
                        mq5: grade.mq5 + (Math.random() - 0.5) * 0.1,
                        mq9: grade.mq9 + (Math.random() - 0.5) * 0.1
                    };
                    updateUIWithResult(grade, 0.92, sensors);
                    announceGrade(grade, 0.92);
                }
            });
        });
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
        populateGradesGrid();
        renderHistory();
        initSpeechRecognition();
        
        // Request camera permission immediately
        await initCamera();
        
        // Show welcome message
        setTimeout(() => {
            speakText("ස්වාගතයි. තේ හඳුනා ගැනීමට කැමරාව භාවිතා කරන්න", 'si');
            showToast("Camera ready! Place tea leaves in frame and tap Identify", "success");
        }, 2000);
    }
    
    // Handle page visibility and cleanup
    window.addEventListener('beforeunload', () => {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        speechSynthesis.cancel();
    });
    
    // Start the app
    init();
</script>
</body>
